<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ยาและนัดหมาย</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#eef3f4;--card:#fff;--ink:#14232b;--muted:#5b6b73;--line:#cfdadd;--teal:#0f6e6e;--teal-d:#0a5252;--amber:#a85a00;--red:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 "Noto Sans Thai",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 64px}
h1{font-size:26px;margin:8px 0 4px}
h2{font-size:20px;margin:0 0 12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--teal);background:var(--teal);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600;min-height:48px}
button:hover{background:var(--teal-d)}
button.ghost{background:#fff;color:var(--teal)}
button.ghost:hover{background:#e3f0f0}
button.danger{background:#fff;border-color:var(--red);color:var(--red)}
button.danger:hover{background:#fbeceb}
button.small{min-height:40px;padding:6px 12px;font-size:16px}
:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.tabs{display:flex;gap:8px;margin:16px 0}
.tabs button{flex:1;background:#fff;color:var(--ink);border-color:var(--line)}
.tabs button[aria-selected=true]{background:var(--teal);color:#fff;border-color:var(--teal)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;min-height:48px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.item{border-top:1px solid var(--line);padding:14px 0;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.item:first-child{border-top:0}
.time{font-size:24px;font-weight:700;color:var(--teal)}
.appt .time{color:var(--amber)}
.meta{color:var(--muted);font-size:16px}
.off{opacity:.55}
.tag{display:inline-block;border-radius:6px;padding:0 8px;font-size:14px;font-weight:600;background:#e3f0f0;color:var(--teal-d)}
.tag.done{background:#eee;color:#555}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.msg{min-height:28px;font-weight:600}
.msg.err{color:var(--red)}
.msg.ok{color:var(--teal-d)}
.empty{color:var(--muted);padding:8px 0}
.note{font-size:15px;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>

<!-- ตั้งค่า: แก้ 2 บรรทัดนี้ที่ <script> ด้านล่างสุดของไฟล์ -->

<section id="login" hidden>
  <h1>ยาและนัดหมาย</h1>
  <p class="meta">เข้าสู่ระบบด้วยอีเมลที่เจ้าของระบบสร้างให้</p>
  <div class="panel">
    <label for="email">อีเมล</label>
    <input id="email" type="email" autocomplete="username">
    <label for="password">รหัสผ่าน</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="actions"><button id="loginBtn">เข้าสู่ระบบ</button></div>
    <p id="loginMsg" class="msg" role="status"></p>
  </div>
</section>

<section id="app" hidden>
  <div class="top">
    <h1>ยาและนัดหมาย</h1>
    <button class="ghost small" id="logoutBtn">ออกจากระบบ</button>
  </div>
  <p id="msg" class="msg" role="status"></p>

  <div class="tabs" role="tablist">
    <button role="tab" id="tabMeds" aria-selected="true">ยา</button>
    <button role="tab" id="tabAppts" aria-selected="false">นัดหมาย</button>
  </div>

  <!-- แท็บยา -->
  <div id="medsView">
    <div class="panel">
      <h2 id="medFormTitle">เพิ่มยา</h2>
      <div class="row">
        <div><label for="mPerson">ของใคร</label><input id="mPerson" value="คุณพ่อ"></div>
        <div><label for="mTime">เวลาทาน (เวลาไทย)</label><input id="mTime" type="time"></div>
      </div>
      <label for="mName">ชื่อยา</label><input id="mName">
      <label for="mDose">ขนาด / วิธีทาน</label><input id="mDose" placeholder="เช่น 1 เม็ด หลังอาหาร">
      <p class="note">ยาที่ทานวันละหลายครั้ง ให้เพิ่มแยกทีละเวลา อย่าใช้ตัวอักษร &lt; &gt; &amp; ในช่องกรอก</p>
      <div class="actions">
        <button id="medSave">บันทึกยา</button>
        <button id="medCancel" class="ghost" hidden>ยกเลิกการแก้ไข</button>
      </div>
    </div>
    <div class="panel">
      <h2>รายการยา</h2>
      <div id="medList"></div>
    </div>
  </div>

  <!-- แท็บนัดหมาย -->
  <div id="apptsView" hidden>
    <div class="panel">
      <h2 id="apptFormTitle">เพิ่มนัดหมาย</h2>
      <div class="row">
        <div><label for="aPerson">ใครไป</label><input id="aPerson" value="คุณพ่อ"></div>
        <div><label for="aWhen">วัน-เวลานัด (เวลาไทย)</label><input id="aWhen" type="datetime-local"></div>
      </div>
      <label for="aTitle">เรื่อง</label><input id="aTitle" placeholder="เช่น ตรวจเบาหวาน">
      <label for="aPlace">สถานที่</label><input id="aPlace">
      <label for="aRemind">เตือนล่วงหน้า</label>
      <select id="aRemind">
        <option value="120">2 ชั่วโมง</option>
        <option value="1440">1 วัน</option>
        <option value="2880">2 วัน</option>
      </select>
      <div class="actions">
        <button id="apptSave">บันทึกนัด</button>
        <button id="apptCancel" class="ghost" hidden>ยกเลิกการแก้ไข</button>
      </div>
    </div>
    <div class="panel">
      <h2>รายการนัด</h2>
      <div id="apptList"></div>
    </div>
  </div>

  <p class="note">ระบบนี้ช่วยเตือนความจำเท่านั้น ชื่อยาและขนาดยาต้องมาจากแพทย์หรือเภสัชกร</p>
</section>

</main>

<script>
// ===== ตั้งค่า: ใส่ค่าจาก Supabase (Project Settings → API) =====
// ใช้เฉพาะ Project URL และ anon public key ห้ามใส่ service_role / secret key
const SUPABASE_URL = "https://xxxxxxxxxxxxx.supabase.co";
const SUPABASE_ANON_KEY = "eyJ...ใส่ anon public key ตรงนี้";
// ================================================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
let editingMed = null, editingAppt = null;

function esc(s){ const d=document.createElement("div"); d.textContent=s ?? ""; return d.innerHTML; }
function say(text, kind){ const m=$("msg"); m.textContent=text||""; m.className="msg "+(kind||""); if(text&&kind==="ok") setTimeout(()=>{ if(m.textContent===text) m.textContent=""; },3000); }
function fmtWhen(iso){ return new Date(iso).toLocaleString("th-TH",{timeZone:"Asia/Bangkok",dateStyle:"long",timeStyle:"short"})+" น."; }
function toInput(iso){ return new Date(iso).toLocaleString("sv-SE",{timeZone:"Asia/Bangkok"}).replace(" ","T").slice(0,16); }
function remindText(m){ return m>=1440 ? (m/1440)+" วัน" : (m/60)+" ชั่วโมง"; }

// ----- ล็อกอิน -----
async function showByAuth(session){
  $("login").hidden = !!session;
  $("app").hidden = !session;
  if(session){ await Promise.all([loadMeds(), loadAppts()]); }
}
$("loginBtn").onclick = async () => {
  $("loginMsg").textContent = ""; $("loginMsg").className = "msg";
  const { error } = await db.auth.signInWithPassword({ email:$("email").value.trim(), password:$("password").value });
  if(error){ $("loginMsg").textContent = "เข้าสู่ระบบไม่สำเร็จ ตรวจสอบอีเมลและรหัสผ่านอีกครั้ง"; $("loginMsg").className="msg err"; }
};
$("password").addEventListener("keydown", e => { if(e.key==="Enter") $("loginBtn").click(); });
$("logoutBtn").onclick = () => db.auth.signOut();
db.auth.onAuthStateChange((_e, session) => showByAuth(session));
db.auth.getSession().then(({data}) => showByAuth(data.session));

// ----- แท็บ -----
function tab(which){
  const meds = which==="meds";
  $("medsView").hidden = !meds; $("apptsView").hidden = meds;
  $("tabMeds").setAttribute("aria-selected", meds); $("tabAppts").setAttribute("aria-selected", !meds);
}
$("tabMeds").onclick = () => tab("meds");
$("tabAppts").onclick = () => tab("appts");

// ----- ยา -----
async function loadMeds(){
  const { data, error } = await db.from("medications").select("*").order("take_time");
  if(error){ say("โหลดรายการยาไม่สำเร็จ: "+error.message, "err"); return; }
  const box = $("medList");
  if(!data.length){ box.innerHTML = '<p class="empty">ยังไม่มียา เพิ่มตัวแรกได้จากฟอร์มด้านบน</p>'; return; }
  box.innerHTML = data.map(m => `
    <div class="item ${m.active?"":"off"}">
      <div>
        <div class="time">${esc(m.take_time.slice(0,5))} น.</div>
        <strong>${esc(m.name)}</strong> <span class="meta">· ${esc(m.person)}</span><br>
        <span class="meta">${esc(m.dose||"ไม่ได้ระบุขนาด")}</span>
        ${m.active?"":' <span class="tag done">ปิดเตือนอยู่</span>'}
      </div>
      <div class="btns">
        <button class="ghost small" data-act="toggle" data-id="${m.id}" data-on="${m.active}">${m.active?"ปิดเตือน":"เปิดเตือน"}</button>
        <button class="ghost small" data-act="edit" data-id="${m.id}">แก้ไข</button>
        <button class="danger small" data-act="del" data-id="${m.id}">ลบ</button>
      </div>
    </div>`).join("");
  box._rows = data;
}
$("medList").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if(!b) return;
  const id = Number(b.dataset.id), row = $("medList")._rows.find(r => r.id===id);
  if(b.dataset.act==="toggle"){
    const { error } = await db.from("medications").update({ active: b.dataset.on!=="true" }).eq("id", id);
    error ? say("เปลี่ยนสถานะไม่สำเร็จ: "+error.message,"err") : (say("บันทึกแล้ว","ok"), loadMeds());
  } else if(b.dataset.act==="del"){
    if(!confirm(`ลบ "${row.name}" ของ ${row.person} ใช่หรือไม่?`)) return;
    const { error } = await db.from("medications").delete().eq("id", id);
    error ? say("ลบไม่สำเร็จ: "+error.message,"err") : (say("ลบแล้ว","ok"), loadMeds());
  } else if(b.dataset.act==="edit"){
    editingMed = id; $("mPerson").value=row.person; $("mName").value=row.name; $("mDose").value=row.dose||""; $("mTime").value=row.take_time.slice(0,5);
    $("medFormTitle").textContent="แก้ไขยา"; $("medSave").textContent="บันทึกการแก้ไข"; $("medCancel").hidden=false;
    $("mName").focus(); window.scrollTo({top:0,behavior:"smooth"});
  }
});
function resetMed(){ editingMed=null; $("mName").value=""; $("mDose").value=""; $("mTime").value=""; $("medFormTitle").textContent="เพิ่มยา"; $("medSave").textContent="บันทึกยา"; $("medCancel").hidden=true; }
$("medCancel").onclick = resetMed;
$("medSave").onclick = async () => {
  const rec = { person:$("mPerson").value.trim()||"คุณพ่อ", name:$("mName").value.trim(), dose:$("mDose").value.trim()||null, take_time:$("mTime").value };
  if(!rec.name || !rec.take_time){ say("กรอกชื่อยาและเวลาทานก่อน","err"); return; }
  const q = editingMed ? db.from("medications").update(rec).eq("id", editingMed) : db.from("medications").insert(rec);
  const { error } = await q;
  if(error){ say("บันทึกไม่สำเร็จ: "+error.message,"err"); return; }
  say("บันทึกแล้ว","ok"); resetMed(); loadMeds();
};

// ----- นัดหมาย -----
async function loadAppts(){
  const { data, error } = await db.from("appointments").select("*").order("appt_at");
  if(error){ say("โหลดนัดหมายไม่สำเร็จ: "+error.message,"err"); return; }
  const box = $("apptList");
  if(!data.length){ box.innerHTML = '<p class="empty">ยังไม่มีนัด เพิ่มได้จากฟอร์มด้านบน</p>'; return; }
  const now = Date.now();
  box.innerHTML = data.map(a => {
    const past = new Date(a.appt_at).getTime() < now;
    return `
    <div class="item appt ${past?"off":""}">
      <div>
        <div class="time">${esc(fmtWhen(a.appt_at))}</div>
        <strong>${esc(a.title)}</strong> <span class="meta">· ${esc(a.person)}</span><br>
        <span class="meta">${esc(a.place||"ไม่ได้ระบุสถานที่")}</span><br>
        <span class="tag ${a.sent?"done":""}">${past?"ผ่านไปแล้ว":(a.sent?"เตือนแล้ว":"จะเตือนล่วงหน้า "+remindText(a.remind_before_minutes))}</span>
      </div>
      <div class="btns">
        <button class="ghost small" data-act="edit" data-id="${a.id}">แก้ไข</button>
        <button class="danger small" data-act="del" data-id="${a.id}">ลบ</button>
      </div>
    </div>`;}).join("");
  box._rows = data;
}
$("apptList").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if(!b) return;
  const id = Number(b.dataset.id), row = $("apptList")._rows.find(r => r.id===id);
  if(b.dataset.act==="del"){
    if(!confirm(`ลบนัด "${row.title}" ใช่หรือไม่?`)) return;
    const { error } = await db.from("appointments").delete().eq("id", id);
    error ? say("ลบไม่สำเร็จ: "+error.message,"err") : (say("ลบแล้ว","ok"), loadAppts());
  } else if(b.dataset.act==="edit"){
    editingAppt = id; $("aPerson").value=row.person; $("aTitle").value=row.title; $("aPlace").value=row.place||""; $("aWhen").value=toInput(row.appt_at);
    $("aRemind").value = String(row.remind_before_minutes);
    $("apptFormTitle").textContent="แก้ไขนัดหมาย"; $("apptSave").textContent="บันทึกการแก้ไข"; $("apptCancel").hidden=false;
    $("aTitle").focus(); window.scrollTo({top:0,behavior:"smooth"});
  }
});
function resetAppt(){ editingAppt=null; $("aTitle").value=""; $("aPlace").value=""; $("aWhen").value=""; $("aRemind").value="120"; $("apptFormTitle").textContent="เพิ่มนัดหมาย"; $("apptSave").textContent="บันทึกนัด"; $("apptCancel").hidden=true; }
$("apptCancel").onclick = resetAppt;
$("apptSave").onclick = async () => {
  const when = $("aWhen").value;
  const rec = {
    person:$("aPerson").value.trim()||"คุณพ่อ", title:$("aTitle").value.trim(), place:$("aPlace").value.trim()||null,
    appt_at: when ? new Date(when+":00+07:00").toISOString() : null,   // ตีความเป็นเวลาไทยเสมอ
    remind_before_minutes: Number($("aRemind").value), sent:false
  };
  if(!rec.title || !rec.appt_at){ say("กรอกเรื่องและวัน-เวลานัดก่อน","err"); return; }
  const q = editingAppt ? db.from("appointments").update(rec).eq("id", editingAppt) : db.from("appointments").insert(rec);
  const { error } = await q;
  if(error){ say("บันทึกไม่สำเร็จ: "+error.message,"err"); return; }
  say("บันทึกแล้ว","ok"); resetAppt(); loadAppts();
};
</script>
</body>
</html>
